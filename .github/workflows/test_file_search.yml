name: Test Google File Search

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '**.pdf'
      - 'test_file_search.py'
      - '.github/workflows/test_file_search.yml'

jobs:
  test-file-search:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Upload PDF and run queries
      env:
        GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        PDF_PATH: vitd_telomere.pdf
      run: |
        echo "🧬 Starting Google File Search test..."
        python test_file_search.py

    - name: Show results summary
      if: always()
      run: |
        echo "✅ Workflow completed!"
        echo "Check the logs above for query results and citations."
