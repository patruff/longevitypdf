name: Query Longevity Papers

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      query:
        description: 'Your question about longevity research'
        required: true
        default: 'What are the main findings in the indexed papers?'
      model:
        description: 'Gemini model to use'
        required: false
        default: 'gemini-2.0-flash-exp'
        type: choice
        options:
          - gemini-2.0-flash-exp
          - gemini-1.5-pro
          - gemini-1.5-flash

jobs:
  query-papers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run custom query
      env:
        GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
      run: |
        echo "🔍 Running query: ${{ github.event.inputs.query }}"
        echo "📊 Using model: ${{ github.event.inputs.model }}"
        python -c "
import os
import sys
from pathlib import Path
sys.path.insert(0, str(Path.cwd()))
from test_file_search import get_client, get_or_create_store, query_papers

# Initialize
client = get_client()
store_name = get_or_create_store(client)

print(f'\n📦 Using store: {store_name}\n')

# Run the query
query = '''${{ github.event.inputs.query }}'''
model = '${{ github.event.inputs.model }}'

answer, citations = query_papers(client, store_name, query, model)
        "

    - name: Query completed
      if: always()
      run: |
        echo "✅ Query workflow completed!"
        echo "Check the logs above for the AI-generated answer and citations."
